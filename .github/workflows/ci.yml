name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: Server, Builder Agent & UI End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            desktop/package-lock.json
            mobile/package-lock.json

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep git

      - name: Install Python Dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -e ../builder/agent playwright
          python -m playwright install --with-deps chromium

      - name: Run client-core Unit Tests
        run: node --test client-core/tests/core.test.ts

      - name: Install JS Dependencies & Type Check (Desktop)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check
          npm run build

      - name: Install JS Dependencies & Type Check (Mobile)
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx svelte-check
          npm run build

      - name: Run End-to-End Tests
        working-directory: server
        run: |
          python -m pytest -q
          python -m pytest -q ../desktop/e2e

  mobile-rust-check:
    name: Mobile Rust & Android Targets Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Linux WebKit Dependencies for Cargo Check
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Mobile Frontend & Check Rust Crate
        run: |
          (cd mobile && npm ci --no-audit --no-fund && npm run build)
          (cd mobile/src-tauri && cargo check)
