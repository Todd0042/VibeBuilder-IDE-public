[project]
name = "vbagent"
version = "0.1.0"
description = "Runs inside the builder: owns the terminals (they keep running while no app is attached) and runs git."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vbagent*"]
