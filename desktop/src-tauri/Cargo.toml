[package]
name = "vibebuilder-ide"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "VibeBuilder IDE (laptop app)"
edition = "2021"

[lib]
name = "vibebuilder_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
hostname = "0.4"
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "time", "macros", "rt-multi-thread", "fs"] }
serde_json = "1"
tunnel-core = { path = "../../tunnel-core" }
# TLS for the tunnel WebSockets: pick ring explicitly and install it at startup (rustls can't guess)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
